# 阶段3配置 - 强化学习微调（修复版）
phase3:
  output_dir: "${project.base_dir}/phase3"
  episodes: 1000
  max_steps: 3000000
  start_epsilon: 0.5  # 🔥 提升初始探索率
  max_steps_per_episode: 120
  eval_every: 100
  eval_episodes: 20
  save_every: 100

  # 🔥 探索策略（重点修复）
  epsilon:
    initial: 0.3        # 从 50% 探索开始
    final: 0.05         # 最终保持 5% 探索
    decay_steps: 50000  # 🔥 500 个 Episode (假设每个 100 步)

  # DAgger配置
  dagger:
    initial_beta: 0.8
    final_beta: 0.05
    decay_steps: 100000  # 🔥 也相应调整

  # 早停策略
  early_stopping:
    enabled: true
    patience: 50
    min_improvement: 0.01

  # 检查点配置
  checkpoint:
    save_freq: 25
    keep_best: true
    metric: "acceptance_rate"

  # 课程学习配置
  curriculum:
    use_curriculum: true
    stages: 3
    initial_expert_ratio: 0.8
    final_expert_ratio: 0.0
    epsilon_decay: 0.995

  # 🔥 RL特定参数（重要调整）
  rl:
    gamma: 0.99
    replay_buffer:
      capacity: 100000
      batch_size: 128      # 🔥 增加到 64
      min_size: 1000      # 🔥 新增：1000 个样本后开始学习
    target_update_freq: 200  # 🔥 改成 100 步更新一次
    learning_rate: 0.0001    # 🔥 新增：学习率