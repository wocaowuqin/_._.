# env.yaml - SFC环境核心配置
# 对应HIRL-MSFC-CE/hirl_sfc_env.py中的环境初始化与运行参数

# ==============================================
# 1. 路径与文件配置
# ==============================================
paths:
  input_dir: "E:\pycharmworkspace\SFC-master\HRL-GNN for Multicast-aware SFC Orchestration\data\input_dir"  # 数据输入目录
  failure_output_dir: "E:\pycharmworkspace\SFC-master\HRL-GNN for Multicast-aware SFC Orchestration\data\failure"  # 故障可视化输出目录
  phase1_requests: "phase1_requests.pkl"  # Phase1请求数据文件
  phase1_events: "phase1_events.pkl"      # Phase1事件数据文件
  fallback_requests: "sorted_requests.pkl"  # 兼容旧版本的请求文件
  fallback_events: "event_list.pkl"        # 兼容旧版本的事件文件

# ==============================================
# 2. 网络资源配置
# ==============================================
resources:
  capacities:
    cpu: 80.0         # 节点CPU容量
    memory: 60.0      # 节点内存容量
    bandwidth: 80.0   # 链路带宽容量
  dc_nodes: [1, 2, 3, 4, 5, 6, 7, 8, 11, 13, 14, 17, 18, 19, 20, 21, 23, 24, 27, 28]  # 数据中心节点列表

# ==============================================
# 3. 环境运行参数
# ==============================================
runtime:
  max_timesteps: 3000  # 最大时间步（T），与self.T保持一致
  max_paths_in_tree: 10  # 树中最大路径数（对应PathManager的max_paths）
  expert_randomness: 0.1  # 专家系统随机性系数

# ==============================================
# 4. 状态与空间配置
# ==============================================
state_space:
  nb_high_level_goals: 10  # 高层目标数量
  nb_low_level_actions: 100  # 低层动作数量（max_paths_in_tree * K_path，K_path从expert获取）
  dim_network: null  # 动态计算：n + n + L + n*K_vnf（n/L/K_vnf从expert获取）
  dim_request: 10    # 请求特征维度
  state_vector_size: null  # 动态计算：dim_network + dim_request

# ==============================================
# 5. 数据加载与切换配置
# ==============================================
dataset:
  auto_reset_time: true  # 加载新数据集时是否强制重置时间指针（t=0）
  reset_resources_on_switch: true  # 切换数据集时是否重置资源状态
  reset_stats_on_switch: true      # 切换数据集时是否重置统计指标

# ==============================================
# 6. 可视化与日志配置
# ==============================================
visualization:
  enable_render: true  # 是否启用可视化
  failure_visualizer:
    auto_layout: true  # 节点位置是否自动布局（无坐标数据时）

logging:
  metrics:
    track_backup_stats: true  # 是否跟踪备份策略统计
    track_resource_usage: true  # 是否跟踪资源使用情况

# ==============================================
# 7. 备份策略配置（集成sfc_backup_system）
# ==============================================
backup_policy:
  enabled: true  # 是否启用备份策略
  vnf_placement_strategy: "resource_aware"  # VNF放置策略（simple_round_robin/resource_aware）